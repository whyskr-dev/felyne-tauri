# Felyne shell — GitLab CI (development host).
#
# GitLab is the main development host; GitHub Actions does the building
# (all three OSes for free on a public repo). This pipeline only runs
# tests + clippy to keep the free-tier minutes for development work.

stages:
  - test

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - src-tauri/target/
  policy: pull-push

test:
  image: rust:1-bookworm
  before_script:
    - apt-get update -y
    - apt-get install -y --no-install-recommends
        curl ca-certificates git
        libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev
        patchelf file
  script:
    - cd src-tauri
    - cargo test
    - cargo clippy --all-targets -- -D warnings
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'