[package]
name = "felyne-tauri"
version = "0.3.0"
description = "Native desktop shell for felyne.app"
authors = ["Felyne Team"]
edition = "2021"

[lib]
name = "felyne_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-mobile-push = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
semver = "1"

# Desktop-only: Tauri's updater does not support iOS/Android (the App Store /
# Play Store own the update path there; this shell ships via GitHub releases).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

# Mobile-only: tiny HTTP client used to read the same `latest.json` the desktop
# updater consumes, so the shell can tell the user an update exists.
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
ureq = { version = "2", features = ["json"] }
