name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux system deps
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Test
        working-directory: src-tauri
        run: cargo test
      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

  publish:
    needs: [test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: ubuntu-22.04
          - platform: windows-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Tauri CLI
        run: npm ci
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux system deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install macOS rust targets
        if: matrix.platform == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'felyne ${{ github.ref_name }}'
          releaseBody: 'See the assets to download below — install the `.dmg` (macOS), `.msi`/`.exe` (Windows), or `.deb`/`.AppImage` (Linux).'
          releaseDraft: false
          prerelease: false
          projectPath: src-tauri
          args: ${{ matrix.args }}

  # Job-level `if` cannot read the secrets context, so a tiny gate job checks
  # which mobile secrets exist (step level CAN read secrets) and the mobile
  # jobs skip themselves when their secrets aren't configured yet.
  mobile-gate:
    needs: [publish]
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.check-android.outputs.run }}
      ios: ${{ steps.check-ios.outputs.run }}
    steps:
      - id: check-android
        run: echo "run=${{ secrets.ANDROID_FIREBASE_JSON != '' }}" >> "$GITHUB_OUTPUT"
      - id: check-ios
        run: echo "run=${{ secrets.IOS_MOBILE_PROVISION != '' }}" >> "$GITHUB_OUTPUT"

  build-android:
    needs: [publish, mobile-gate]
    if: ${{ needs.mobile-gate.outputs.android == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Tauri CLI
        run: npm ci
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: android-actions/setup-android@v3
      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d
          link-to-sdk: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Android Rust targets
        run: rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
      - name: Setup Android signing
        working-directory: src-tauri/gen/android
        run: |
          echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" > keystore.properties
          echo "password=${{ secrets.ANDROID_KEY_PASSWORD }}" >> keystore.properties
          base64 -d <<< "${{ secrets.ANDROID_KEY_BASE64 }}" > "$RUNNER_TEMP/keystore.jks"
          echo "storeFile=$RUNNER_TEMP/keystore.jks" >> keystore.properties
      - name: Provide google-services.json (Firebase/FCM)
        working-directory: src-tauri/gen/android/app
        run: base64 -d <<< "${{ secrets.ANDROID_FIREBASE_JSON }}" > google-services.json
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        with:
          projectPath: src-tauri
          tagName: ${{ github.ref_name }}
          releaseName: 'felyne ${{ github.ref_name }}'
          releaseBody: 'Android APK (universal, 4 ABIs) built on GitHub Actions.'
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: false
          mobile: android
          args: --apk --target universal

  build-ios:
    needs: [publish, mobile-gate]
    if: ${{ needs.mobile-gate.outputs.ios == 'true' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Tauri CLI
        run: npm ci
      - uses: dtolnay/rust-toolchain@stable
      - name: Install iOS Rust target
        run: rustup target add aarch64-apple-ios
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_MOBILE_PROVISION: ${{ secrets.IOS_MOBILE_PROVISION }}
        with:
          projectPath: src-tauri
          tagName: ${{ github.ref_name }}
          releaseName: 'felyne ${{ github.ref_name }}'
          releaseBody: 'iOS .ipa (ad-hoc, arm64) built on GitHub Actions. Needs a device whose UDID is in the provisioning profile.'
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: false
          mobile: ios
          args: --target aarch64-apple-ios

  sync-gitlab:
    needs: [publish, mobile-gate, build-android, build-ios]
    # Run even when a mobile job was skipped for missing secrets: !failure()
    # treats skipped needed jobs as success.
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch GitHub release assets
        id: assets
        if: ${{ env.GITLAB_TOKEN != '' }}
        run: |
          ASSETS=$(gh api "repos/whyskr-dev/felyne-tauri/releases/tags/$TAG" \
            --jq '[.assets[] | {name: .name, url: .browser_download_url}]')
          echo "links=$ASSETS" >> "$GITHUB_OUTPUT"
          echo "$ASSETS" | jq -r '.[].name'
      - name: Push tag to GitLab
        if: ${{ env.GITLAB_TOKEN != '' }}
        run: |
          git push "https://oauth2:${GITLAB_TOKEN}@gitlab.com/whyskr-club/felyne-tauri.git" "$TAG" 2>&1 | tail -1
      - name: Create or update GitLab release
        if: ${{ env.GITLAB_TOKEN != '' }}
        run: |
          BODY=$(jq -n \
            --arg tag "$TAG" \
            --arg url "https://github.com/whyskr-dev/felyne-tauri/releases/tag/$TAG" \
            --argjson links '${{ steps.assets.outputs.links }}' \
            '{name: $tag, tag_name: $tag,
              description: ("Built on GitHub Actions — see " + $url),
              assets: {links: $links}}')
          RESP=$(curl -sS -X POST \
              -H "PRIVATE-TOKEN: $GITLAB_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$BODY" \
              "https://gitlab.com/api/v4/projects/whyskr-club%2Ffelyne-tauri/releases" 2>&1) || true
          if echo "$RESP" | jq -e '.tag_name' >/dev/null 2>&1; then
            echo "Created GitLab release $TAG"
          else
            echo "POST failed: $(echo "$RESP" | head -c 300)"
            RESP=$(curl -sS -X PUT \
              -H "PRIVATE-TOKEN: $GITLAB_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$BODY" \
              "https://gitlab.com/api/v4/projects/whyskr-club%2Ffelyne-tauri/releases/$TAG" 2>&1)
            if echo "$RESP" | jq -e '.tag_name' >/dev/null 2>&1; then
              echo "Updated GitLab release $TAG"
            else
              echo "PUT failed: $(echo "$RESP" | head -c 300)"
              exit 1
            fi
          fi