name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux system deps
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Test
        working-directory: src-tauri
        run: cargo test
      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

  publish:
    needs: [test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: ubuntu-22.04
          - platform: windows-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux system deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install macOS rust targets
        if: matrix.platform == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'felyne ${{ github.ref_name }}'
          releaseBody: 'See the assets to download below — install the `.dmg` (macOS), `.msi`/`.exe` (Windows), or `.deb`/`.AppImage` (Linux).'
          releaseDraft: false
          prerelease: false
          projectPath: src-tauri
          args: ${{ matrix.args }}

  sync-gitlab:
    needs: [publish]
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Fetch GitHub release assets
        id: assets
        if: ${{ env.GITLAB_TOKEN != '' }}
        run: |
          ASSETS=$(gh api "repos/whyskr-dev/felyne-tauri/releases/tags/$TAG" \
            --jq '[.assets[] | {name: .name, url: .browser_download_url}]')
          echo "links=$ASSETS" >> "$GITHUB_OUTPUT"
          echo "$ASSETS" | jq -r '.[].name'
      - name: Create or update GitLab release
        if: ${{ env.GITLAB_TOKEN != '' }}
        run: |
          BODY=$(jq -n \
            --arg tag "$TAG" \
            --arg url "https://github.com/whyskr-dev/felyne-tauri/releases/tag/$TAG" \
            --argjson links '${{ steps.assets.outputs.links }}' \
            '{name: $tag, tag_name: $tag,
              description: ("Built on GitHub Actions — see " + $url),
              assets: {links: $links}}')
          if curl -fsS -X POST \
              -H "PRIVATE-TOKEN: $GITLAB_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$BODY" \
              "https://gitlab.com/api/v4/projects/whyskr-club%2Ffelyne-tauri/releases" >/dev/null 2>&1; then
            echo "Created GitLab release $TAG"
          else
            curl -fsS -X PUT \
              -H "PRIVATE-TOKEN: $GITLAB_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$BODY" \
              "https://gitlab.com/api/v4/projects/whyskr-club%2Ffelyne-tauri/releases/$TAG" >/dev/null
            echo "Updated GitLab release $TAG"
          fi